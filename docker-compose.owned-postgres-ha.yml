# Opt-in ONLY Applicant/Record PostgreSQL HA; append after base and owned-broker.
# Fresh HA volumes deliberately do NOT adopt or erase the legacy single-node volumes.
# Read docs/applicant-record-postgres-ha.md BEFORE enabling with existing data.
services:
  owned-ha-etcd-1:
    image: quay.io/coreos/etcd:v3.5.17@sha256:a055da833a7c013b836ed0822e8ec1f99b059658be255ad8d0fcd31b635ae3d6
    restart: unless-stopped
    networks: [owned-ha-control]
    command:
      - /usr/local/bin/etcd
      - --name=owned-ha-etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://owned-ha-etcd-1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://owned-ha-etcd-1:2380
      - --initial-cluster=owned-ha-etcd-1=http://owned-ha-etcd-1:2380,owned-ha-etcd-2=http://owned-ha-etcd-2:2380,owned-ha-etcd-3=http://owned-ha-etcd-3:2380
      - --initial-cluster-token=owned-postgres-ha
      - --initial-cluster-state=new
    volumes: [owned-ha-etcd-1:/etcd-data]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 3s
      timeout: 2s
      retries: 20
  owned-ha-etcd-2:
    image: quay.io/coreos/etcd:v3.5.17@sha256:a055da833a7c013b836ed0822e8ec1f99b059658be255ad8d0fcd31b635ae3d6
    restart: unless-stopped
    networks: [owned-ha-control]
    command:
      - /usr/local/bin/etcd
      - --name=owned-ha-etcd-2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://owned-ha-etcd-2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://owned-ha-etcd-2:2380
      - --initial-cluster=owned-ha-etcd-1=http://owned-ha-etcd-1:2380,owned-ha-etcd-2=http://owned-ha-etcd-2:2380,owned-ha-etcd-3=http://owned-ha-etcd-3:2380
      - --initial-cluster-token=owned-postgres-ha
      - --initial-cluster-state=new
    volumes: [owned-ha-etcd-2:/etcd-data]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 3s
      timeout: 2s
      retries: 20
  owned-ha-etcd-3:
    image: quay.io/coreos/etcd:v3.5.17@sha256:a055da833a7c013b836ed0822e8ec1f99b059658be255ad8d0fcd31b635ae3d6
    restart: unless-stopped
    networks: [owned-ha-control]
    command:
      - /usr/local/bin/etcd
      - --name=owned-ha-etcd-3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://owned-ha-etcd-3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://owned-ha-etcd-3:2380
      - --initial-cluster=owned-ha-etcd-1=http://owned-ha-etcd-1:2380,owned-ha-etcd-2=http://owned-ha-etcd-2:2380,owned-ha-etcd-3=http://owned-ha-etcd-3:2380
      - --initial-cluster-token=owned-postgres-ha
      - --initial-cluster-state=new
    volumes: [owned-ha-etcd-3:/etcd-data]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 3s
      timeout: 2s
      retries: 20
  applicant-db:
    image: ${OWNED_POSTGRES_HA_IMAGE:-student-id-owned-postgres-ha:lab5-local}
    build: ./docker/owned-postgres-ha
    restart: unless-stopped
    networks: !override [applicant-net, owned-ha-control]
    environment:
      HA_NAME: applicant-db
      HA_SCOPE: applicant
      HA_ETCD_HOSTS: owned-ha-etcd-1:2379,owned-ha-etcd-2:2379,owned-ha-etcd-3:2379
      HA_APP_USER: applicant_user
      HA_APP_DATABASE: applicant_db
      HA_APP_PASSWORD: ${APPLICANT_DB_PASSWORD:?set a URL-safe 32..256 character app password}
      HA_ADMIN_PASSWORD: ${APPLICANT_HA_ADMIN_PASSWORD:?set a distinct HA admin credential}
      HA_REPLICATION_PASSWORD: ${APPLICANT_HA_REPLICATION_PASSWORD:?set a distinct replication credential}
      HA_REST_PASSWORD: ${APPLICANT_HA_REST_PASSWORD:?set a distinct Patroni control credential}
    volumes: !override [applicant-ha-pg-1:/var/lib/postgresql/ha]
    healthcheck:
      test: ["CMD", "/opt/patroni/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health',timeout=1)"]
      interval: 3s
      timeout: 2s
      start_period: 15s
      retries: 30
    depends_on:
      owned-ha-etcd-1:
        condition: service_healthy
      owned-ha-etcd-2:
        condition: service_healthy
      owned-ha-etcd-3:
        condition: service_healthy
  applicant-db-2:
    image: ${OWNED_POSTGRES_HA_IMAGE:-student-id-owned-postgres-ha:lab5-local}
    build: ./docker/owned-postgres-ha
    restart: unless-stopped
    networks: !override [applicant-net, owned-ha-control]
    environment:
      HA_NAME: applicant-db-2
      HA_SCOPE: applicant
      HA_ETCD_HOSTS: owned-ha-etcd-1:2379,owned-ha-etcd-2:2379,owned-ha-etcd-3:2379
      HA_APP_USER: applicant_user
      HA_APP_DATABASE: applicant_db
      HA_APP_PASSWORD: ${APPLICANT_DB_PASSWORD:?set a URL-safe 32..256 character app password}
      HA_ADMIN_PASSWORD: ${APPLICANT_HA_ADMIN_PASSWORD:?set a distinct HA admin credential}
      HA_REPLICATION_PASSWORD: ${APPLICANT_HA_REPLICATION_PASSWORD:?set a distinct replication credential}
      HA_REST_PASSWORD: ${APPLICANT_HA_REST_PASSWORD:?set a distinct Patroni control credential}
    volumes: !override [applicant-ha-pg-2:/var/lib/postgresql/ha]
    healthcheck:
      test: ["CMD", "/opt/patroni/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health',timeout=1)"]
      interval: 3s
      timeout: 2s
      start_period: 15s
      retries: 30
    depends_on:
      owned-ha-etcd-1:
        condition: service_healthy
      owned-ha-etcd-2:
        condition: service_healthy
      owned-ha-etcd-3:
        condition: service_healthy
  applicant-db-3:
    image: ${OWNED_POSTGRES_HA_IMAGE:-student-id-owned-postgres-ha:lab5-local}
    build: ./docker/owned-postgres-ha
    restart: unless-stopped
    networks: !override [applicant-net, owned-ha-control]
    environment:
      HA_NAME: applicant-db-3
      HA_SCOPE: applicant
      HA_ETCD_HOSTS: owned-ha-etcd-1:2379,owned-ha-etcd-2:2379,owned-ha-etcd-3:2379
      HA_APP_USER: applicant_user
      HA_APP_DATABASE: applicant_db
      HA_APP_PASSWORD: ${APPLICANT_DB_PASSWORD:?set a URL-safe 32..256 character app password}
      HA_ADMIN_PASSWORD: ${APPLICANT_HA_ADMIN_PASSWORD:?set a distinct HA admin credential}
      HA_REPLICATION_PASSWORD: ${APPLICANT_HA_REPLICATION_PASSWORD:?set a distinct replication credential}
      HA_REST_PASSWORD: ${APPLICANT_HA_REST_PASSWORD:?set a distinct Patroni control credential}
    volumes: !override [applicant-ha-pg-3:/var/lib/postgresql/ha]
    healthcheck:
      test: ["CMD", "/opt/patroni/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health',timeout=1)"]
      interval: 3s
      timeout: 2s
      start_period: 15s
      retries: 30
    depends_on:
      owned-ha-etcd-1:
        condition: service_healthy
      owned-ha-etcd-2:
        condition: service_healthy
      owned-ha-etcd-3:
        condition: service_healthy
  applicant-service:
    image: ${HA_APPLICANT_IMAGE:?set a reviewed failover-aware applicant 1.5.0+ image}
    environment:
      DB_URL: jdbc:postgresql://applicant-db:5432,applicant-db-2:5432,applicant-db-3:5432/applicant_db?targetServerType=primary&connectTimeout=1&socketTimeout=3&hostRecheckSeconds=1
  applicant-service-2:
    image: ${HA_APPLICANT_IMAGE:?set a reviewed failover-aware applicant 1.5.0+ image}
    environment:
      DB_URL: jdbc:postgresql://applicant-db:5432,applicant-db-2:5432,applicant-db-3:5432/applicant_db?targetServerType=primary&connectTimeout=1&socketTimeout=3&hostRecheckSeconds=1
  university-record-db:
    image: ${OWNED_POSTGRES_HA_IMAGE:-student-id-owned-postgres-ha:lab5-local}
    build: ./docker/owned-postgres-ha
    restart: unless-stopped
    networks: !override [record-net, owned-ha-control]
    environment:
      HA_NAME: university-record-db
      HA_SCOPE: record
      HA_ETCD_HOSTS: owned-ha-etcd-1:2379,owned-ha-etcd-2:2379,owned-ha-etcd-3:2379
