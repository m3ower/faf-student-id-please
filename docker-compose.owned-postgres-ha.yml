  university-record-service:
    image: ${HA_RECORD_IMAGE:?set a reviewed failover-aware record 1.5.0+ image}
    environment:
      DB_URL: postgres://record_user:${RECORD_DB_PASSWORD}@university-record-db:5432,university-record-db-2:5432,university-record-db-3:5432/record_db?sslmode=disable&connect_timeout=1&target_session_attrs=read-write
  university-record-service-2:
    image: ${HA_RECORD_IMAGE:?set a reviewed failover-aware record 1.5.0+ image}
    environment:
      DB_URL: postgres://record_user:${RECORD_DB_PASSWORD}@university-record-db:5432,university-record-db-2:5432,university-record-db-3:5432/record_db?sslmode=disable&connect_timeout=1&target_session_attrs=read-write

