  university-record-db-3:
    image: ${OWNED_POSTGRES_HA_IMAGE:-student-id-owned-postgres-ha:lab5-local}
    build: ./docker/owned-postgres-ha
    restart: unless-stopped
    networks: !override [record-net, owned-ha-control]
    environment:
      HA_NAME: university-record-db-3
      HA_SCOPE: record
      HA_ETCD_HOSTS: owned-ha-etcd-1:2379,owned-ha-etcd-2:2379,owned-ha-etcd-3:2379
      HA_APP_USER: record_user
      HA_APP_DATABASE: record_db
      HA_APP_PASSWORD: ${RECORD_DB_PASSWORD:?set a URL-safe 32..256 character app password}
      HA_ADMIN_PASSWORD: ${RECORD_HA_ADMIN_PASSWORD:?set a distinct HA admin credential}
      HA_REPLICATION_PASSWORD: ${RECORD_HA_REPLICATION_PASSWORD:?set a distinct replication credential}
      HA_REST_PASSWORD: ${RECORD_HA_REST_PASSWORD:?set a distinct Patroni control credential}
    volumes: !override [record-ha-pg-3:/var/lib/postgresql/ha]
    healthcheck:
      test: ["CMD", "/opt/patroni/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health',timeout=1)"]
