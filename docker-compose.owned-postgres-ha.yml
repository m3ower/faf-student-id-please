  owned-ha-control:
    internal: true
volumes:
  owned-ha-etcd-1:
  owned-ha-etcd-2:
  owned-ha-etcd-3:
  applicant-ha-pg-1:
  applicant-ha-pg-2:
  applicant-ha-pg-3:
  record-ha-pg-1:
  record-ha-pg-2:
  record-ha-pg-3:
