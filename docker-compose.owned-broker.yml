# Opt-in Lab 4 Broker deployment: the Message Broker plus the services migrated to it
# (Applicant/Record 1.2.0 and Moderation/Discord DMs lab3-0.8.0 over gRPC).
# Requires matching images and private configuration; does not change the default
# deployment/release pins or peer services that have not migrated.
services:
  service-discovery:
    image: ${OWNED_DISCOVERY_IMAGE:-cmmarin/student-id-service-discovery:lab4-0.8.0}

  message-broker:
    image: ${OWNED_BROKER_IMAGE:?set a published Broker image bundling the reviewed owned grpc delivery choices}
    networks: [default, applicant-net, record-net]
    environment:
      DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_REGISTRATION_TOKEN: ${DISCOVERY_REGISTRATION_TOKEN:?set the Discovery machine credential}
      SERVICE_ADVERTISE_URL: http://message-broker:8093
      BROKER_CALLER_TOKENS_JSON: ${BROKER_CALLER_TOKENS_JSON:?include each actual caller with a distinct credential}
      APPLICANT_INTERNAL_TOKEN: ${APPLICANT_INTERNAL_TOKEN:?match Applicant SERVICE_INTERNAL_TOKEN}
      RECORD_INTERNAL_TOKEN: ${RECORD_INTERNAL_TOKEN:?match Record SERVICE_INTERNAL_TOKEN}
      CREDENTIAL_INTERNAL_TOKEN: ${CREDENTIAL_INTERNAL_TOKEN:?match the actual Credential receiver}
      SESSION_INTERNAL_TOKEN: ${SESSION_INTERNAL_TOKEN:?match the actual Session receiver}
      RULES_INTERNAL_TOKEN: ${RULES_INTERNAL_TOKEN:-}
      MODERATION_INTERNAL_TOKEN: ${MODERATION_INTERNAL_TOKEN:-}
      DMS_INTERNAL_TOKEN: ${DMS_INTERNAL_TOKEN:-}
      PLAYER_INTERNAL_TOKEN: ${PLAYER_INTERNAL_TOKEN:-}
    depends_on:
      service-discovery:
        condition: service_healthy

  applicant-service: &owned-applicant
    image: ${OWNED_APPLICANT_IMAGE:?set a published grpc-capable Applicant 1.2.0+ image}
    environment: &owned-applicant-env
      # Private listener: advertised HTTP 8080 +1000. Never publish this port.
      GRPC_PORT: "9080"
      BROKER_GRPC_TARGET: message-broker:9093
      GATEWAY_URL: ""
      APPLICANT_SERVICE_URL: ""
      RECORD_SERVICE_URL: ""
      BROKER_SERVICE_TOKEN: ${APPLICANT_BROKER_SERVICE_TOKEN:?match this caller in BROKER_CALLER_TOKENS_JSON}
      SERVICE_INTERNAL_TOKEN: ${APPLICANT_INTERNAL_TOKEN:?set the Applicant receiver credential}
      MANAGEMENT_TOKEN: ${APPLICANT_MANAGEMENT_TOKEN:?set a separate management credential}
    depends_on:
      message-broker:
        condition: service_healthy

  applicant-service-2:
    <<: *owned-applicant
    profiles: [replicas]
    environment: *owned-applicant-env

  university-record-service: &owned-record
    image: ${OWNED_RECORD_IMAGE:?set a published grpc-capable Record 1.2.0+ image}
    environment: &owned-record-env
      SESSION_CLIENT: broker
      BROKER_GRPC_TARGET: message-broker:9093
      GATEWAY_URL: ""
      APPLICANT_SERVICE_URL: ""
      RECORD_SERVICE_URL: ""
      BROKER_SERVICE_TOKEN: ${RECORD_BROKER_SERVICE_TOKEN:?match this caller in BROKER_CALLER_TOKENS_JSON}
      SERVICE_INTERNAL_TOKEN: ${RECORD_INTERNAL_TOKEN:?set the Record receiver credential}
      MANAGEMENT_TOKEN: ${RECORD_MANAGEMENT_TOKEN:?set a separate management credential}
    depends_on:
      message-broker:
        condition: service_healthy

  university-record-service-2:
    <<: *owned-record
    profiles: [replicas]
    environment: *owned-record-env

  gateway-service:
    environment:
      # Public backend authentication remains Gateway's responsibility. Record's
      # receiver token must match its entry; this is not a Broker caller map.
      GATEWAY_TARGET_TOKENS_JSON: ${GATEWAY_TARGET_TOKENS_JSON:?configure the actual public receiver credentials}

  # Credential/Rules: gRPC publishers and consumers. Requires the matching Broker
  # release with the identical reviewed per-group transport catalog.
  credential-service: &owned-credential
    image: ${OWNED_CREDENTIAL_IMAGE:-cmmarin/student-id-credential-service:lab4-1.1.0}
    environment: &owned-credential-env
      BROKER_URL: http://message-broker:8093
      BROKER_SERVICE_TOKEN: ${CREDENTIAL_BROKER_SERVICE_TOKEN:?match credential-service in BROKER_CALLER_TOKENS_JSON}
      CREDENTIAL_INTERNAL_TOKEN: ${CREDENTIAL_INTERNAL_TOKEN:?match the Credential receiver credential}
      BUSINESS_HTTP_BINDINGS_JSON: '{"applicant.context":"/internal/v1/applicants/context","record.facts":"/internal/v1/records/facts","applicant.ready":"/internal/v1/applicants/events/credentials-ready","record.ready":"/internal/v1/records/events/credentials-ready"}'
      BROKER_TRANSPORT: grpc
      BROKER_GRPC_TARGET: message-broker:9093
      GRPC_ENABLED: "true"
      GRPC_BIND_ADDRESS: 0.0.0.0
      GRPC_PORT: "9080"
      GRPC_ALLOW_PLAINTEXT: "true"
    depends_on:
      message-broker:
        condition: service_healthy

  credential-service-2:
    <<: *owned-credential
    profiles: [replicas]
    environment: *owned-credential-env

  rules-service: &owned-rules
    image: ${OWNED_RULES_IMAGE:-cmmarin/student-id-rules-service:lab4-1.1.0}
    environment: &owned-rules-env
      BROKER_URL: http://message-broker:8093
      BROKER_SERVICE_TOKEN: ${RULES_BROKER_SERVICE_TOKEN:?match rules-service in BROKER_CALLER_TOKENS_JSON}
      RULES_INTERNAL_TOKEN: ${RULES_INTERNAL_TOKEN:?match the Rules receiver credential}
      BUSINESS_HTTP_BINDINGS_JSON: '{"session.context":"/internal/v1/session-state/get","record.facts":"/internal/v1/records/facts"}'
      BROKER_TRANSPORT: grpc
      BROKER_GRPC_TARGET: message-broker:9093
      GRPC_ENABLED: "true"
      GRPC_BIND_ADDRESS: 0.0.0.0
      GRPC_PORT: "9081"
      GRPC_ALLOW_PLAINTEXT: "true"
    depends_on:
      message-broker:
        condition: service_healthy

  rules-service-2:
    <<: *owned-rules
    profiles: [replicas]
    environment: *owned-rules-env

  # ---- Moderation and Discord DMs on the Broker (Lab 4 Tasks 5-8) ----
  # Released lab3-0.8.0 images: every business call is published to the Broker over gRPC
  # (MessageBroker at message-broker:9093) and the Broker delivers to them over gRPC
  # (MessageConsumer on the advertised port + 1000 = 9080) once transports.json names
  # their groups grpc. gRPC ports stay on the private network: none is published.
  moderation-service: &owned-moderation
    image: ${DOCKERHUB_USER:-meow3r}/student-id-moderation-service:${OWNED_MODERATION_VERSION:-lab3-0.8.0}
    environment: &owned-moderation-env
      BROKER_TRANSPORT: grpc
      BROKER_GRPC_TARGET: message-broker:9093
      BROKER_URL: http://message-broker:8093
      GRPC_PORT: "9080"
      BROKER_SERVICE_TOKEN: ${MODERATION_BROKER_SERVICE_TOKEN:?match moderation-service in BROKER_CALLER_TOKENS_JSON}
      MODERATION_INTERNAL_TOKEN: ${MODERATION_INTERNAL_TOKEN:?set the Moderation receiver credential}
      MODERATION_POLICY_ADMINS: ${MODERATION_POLICY_ADMINS:-}
    depends_on:
      message-broker:
        condition: service_healthy

  moderation-service-2:
    <<: *owned-moderation
    profiles: [replicas]
    environment: *owned-moderation-env

  discord-dms-service: &owned-dms
    image: ${DOCKERHUB_USER:-meow3r}/student-id-discord-dms-service:${OWNED_DMS_VERSION:-lab3-0.8.0}
    environment: &owned-dms-env
      SESSION_CLIENT: broker
      BROKER_TRANSPORT: grpc
      BROKER_GRPC_TARGET: message-broker:9093
      BROKER_URL: http://message-broker:8093
      GRPC_PORT: "9080"
      BROKER_SERVICE_TOKEN: ${DMS_BROKER_SERVICE_TOKEN:?match discord-dms-service in BROKER_CALLER_TOKENS_JSON}
      DMS_INTERNAL_TOKEN: ${DMS_INTERNAL_TOKEN:?set the DMs receiver credential}
      # The Player Service RS256 public key, the same value the Gateway verifies with.
      PLAYER_JWT_PUBLIC_KEY_B64: ${GATEWAY_JWT_PUBLIC_KEY_B64:?set the Player public key}
    depends_on:
      message-broker:
        condition: service_healthy

  discord-dms-service-2:
    <<: *owned-dms
    profiles: [replicas]
    environment: *owned-dms-env
