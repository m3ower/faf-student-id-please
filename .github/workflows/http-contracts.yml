name: http contract checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-contract-tests:
    name: http-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install coverage into an isolated environment
        run: |
          python3 -m venv docs-local/contract-test-venv
          docs-local/contract-test-venv/bin/python -m pip install --disable-pip-version-check --only-binary=grpcio,grpcio-tools,protobuf coverage==7.10.6 grpcio-tools==1.76.0
      - name: Validate the catalog, its examples and the generated OpenAPI
        run: python3 scripts/validate_http_contracts.py
      - name: Validate messaging bindings and owner subscriptions
        run: python3 scripts/validate_messaging_contracts.py
      - name: Validate and compile the gRPC messaging contract
        run: docs-local/contract-test-venv/bin/python scripts/validate_grpc_contract.py --require-compiler
      - name: Test the gRPC contract validator
        run: |
          docs-local/contract-test-venv/bin/python -m coverage run --data-file=docs-local/grpc-contract.coverage --source=scripts.validate_grpc_contract -m unittest tests.test_grpc_contract -v
          docs-local/contract-test-venv/bin/python -m coverage report --data-file=docs-local/grpc-contract.coverage --fail-under=70 --show-missing
      - name: Test messaging contract generation
        run: |
          docs-local/contract-test-venv/bin/python -m coverage run --data-file=docs-local/messaging-contracts.coverage --source=scripts.validate_messaging_contracts -m unittest tests.test_messaging_contracts -v
          docs-local/contract-test-venv/bin/python -m coverage report --data-file=docs-local/messaging-contracts.coverage --fail-under=70 --show-missing
      - name: Test the validator
        run: |
          docs-local/contract-test-venv/bin/python -m coverage run --data-file=docs-local/http-contracts.coverage --source=scripts.validate_http_contracts -m unittest tests.test_http_contracts -v
          docs-local/contract-test-venv/bin/python -m coverage report --data-file=docs-local/http-contracts.coverage --fail-under=70 --show-missing
