name: postman collection checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postman-collections:
    name: postman-collections
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check generated collection is current
        run: python3 scripts/build_shared_postman.py --check
      - name: Check scripts and isolated service variables
        run: node tests/test_shared_postman.js
