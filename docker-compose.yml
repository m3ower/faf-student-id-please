# Shared Lab 1 deployment. Images are pulled from Docker Hub; no local Dockerfile is built.
# Copy .env.example to .env and supply all password values before starting the stack.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CREDENTIAL_DB_NAME: ${CREDENTIAL_DB_NAME:-credential_db}
      CREDENTIAL_DB_USER: ${CREDENTIAL_DB_USER:-credential_user}
      CREDENTIAL_DB_PASSWORD: ${CREDENTIAL_DB_PASSWORD:?set CREDENTIAL_DB_PASSWORD in .env}
      RULES_DB_NAME: ${RULES_DB_NAME:-rules_db}
      RULES_DB_USER: ${RULES_DB_USER:-rules_user}
      RULES_DB_PASSWORD: ${RULES_DB_PASSWORD:?set RULES_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init-owned-services.sh:/docker-entrypoint-initdb.d/10-owned-services.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  credential-service:
    image: ${CREDENTIAL_IMAGE:-cmmarin/student-id-credential-service:0.1.0}
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${CREDENTIAL_DB_NAME:-credential_db}
      DB_USER: ${CREDENTIAL_DB_USER:-credential_user}
      DB_PASSWORD: ${CREDENTIAL_DB_PASSWORD:?set CREDENTIAL_DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  rules-service:
    image: ${RULES_IMAGE:-cmmarin/student-id-rules-service:0.1.0}
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${RULES_DB_NAME:-rules_db}
      DB_USER: ${RULES_DB_USER:-rules_user}
      DB_PASSWORD: ${RULES_DB_PASSWORD:?set RULES_DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  player-service:
    image: ${PLAYER_IMAGE:-vasiok11/student-id-player-service:0.2.0}
    ports:
      - "8082:8080"
    environment:
      PLAYER_DB_URL: jdbc:postgresql://player-db:5432/${PLAYER_DB_NAME:-player}
      PLAYER_DB_USER: ${PLAYER_DB_USER:-player}
      PLAYER_DB_PASSWORD: ${PLAYER_DB_PASSWORD:?set PLAYER_DB_PASSWORD in .env}
    depends_on:
      player-db:
        condition: service_healthy

  player-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PLAYER_DB_NAME:-player}
      POSTGRES_USER: ${PLAYER_DB_USER:-player}
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD:?set PLAYER_DB_PASSWORD in .env}
    volumes:
      - player-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  session-service:
    image: ${SESSION_IMAGE:-vasiok11/student-id-session-service:0.2.0}
    ports:
      - "8083:8080"
    environment:
      SESSION_DB_URL: postgres://${SESSION_DB_USER:-session}:${SESSION_DB_PASSWORD:?set SESSION_DB_PASSWORD in .env}@session-db:5432/${SESSION_DB_NAME:-session}?sslmode=disable
    depends_on:
      session-db:
        condition: service_healthy

  session-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SESSION_DB_NAME:-session}
      POSTGRES_USER: ${SESSION_DB_USER:-session}
      POSTGRES_PASSWORD: ${SESSION_DB_PASSWORD:?set SESSION_DB_PASSWORD in .env}
    volumes:
      - session-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  applicant-service:
    image: ${APPLICANT_IMAGE:-andreiisthebest/student-id-applicant-service:0.1.1}
    ports:
      - "8084:8080"
    environment:
      DB_URL: jdbc:postgresql://applicant-db:5432/applicant_db
      DB_USER: applicant_user
      DB_PASSWORD: ${APPLICANT_DB_PASSWORD:?set APPLICANT_DB_PASSWORD in .env}
    depends_on:
      applicant-db:
        condition: service_healthy

  applicant-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: applicant_db
      POSTGRES_USER: applicant_user
      POSTGRES_PASSWORD: ${APPLICANT_DB_PASSWORD:?set APPLICANT_DB_PASSWORD in .env}
    volumes:
      - applicant-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  university-record-service:
    image: ${RECORD_IMAGE:-andreiisthebest/student-id-university-record-service:0.1.1}
    ports:
      - "8085:8081"
    environment:
      DB_URL: postgres://record_user:${RECORD_DB_PASSWORD:?set RECORD_DB_PASSWORD in .env}@university-record-db:5432/record_db?sslmode=disable
    depends_on:
      university-record-db:
        condition: service_healthy

  university-record-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: record_db
      POSTGRES_USER: record_user
      POSTGRES_PASSWORD: ${RECORD_DB_PASSWORD:?set RECORD_DB_PASSWORD in .env}
    volumes:
      - record-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  moderation-service:
    image: ${DOCKERHUB_USER:-m3ower}/student-id-moderation-service:${MODERATION_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://moderation-db:5432/${MODERATION_DB_NAME:-moderation}
      DB_USER: ${MODERATION_DB_USER:-moderation}
      DB_PASSWORD: ${MODERATION_DB_PASSWORD:?set MODERATION_DB_PASSWORD in .env}
    ports:
      - "8087:8080"
    depends_on:
      moderation-db:
        condition: service_healthy

  moderation-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MODERATION_DB_NAME:-moderation}
      POSTGRES_USER: ${MODERATION_DB_USER:-moderation}
      POSTGRES_PASSWORD: ${MODERATION_DB_PASSWORD:?set MODERATION_DB_PASSWORD in .env}
    volumes:
      - moderation-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  discord-dms-service:
    image: ${DOCKERHUB_USER:-m3ower}/student-id-discord-dms-service:${DMS_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      STORE: redis
      REDIS_ADDR: dms-redis:6379
      REDIS_PASSWORD: ${DMS_REDIS_PASSWORD:?set DMS_REDIS_PASSWORD in .env}
      SESSION_CLIENT: mock
      WS_ALLOWED_ORIGINS: "*"
    ports:
      - "8088:8080"
    depends_on:
      dms-redis:
        condition: service_healthy

  dms-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${DMS_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${DMS_REDIS_PASSWORD}
    volumes:
      - dms-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  player-pg-data:
  session-pg-data:
  applicant-pg-data:
  record-pg-data:
  moderation-pg-data:
  dms-redis-data:
